<!-- Bug: Paragraf Lupa Ditutup -->

<!-- ============================================================
     MISI KAMU
     ============================================================
     Halaman ini seharusnya menampilkan DUA paragraf terpisah:
       1. "Nama saya Arin"
       2. "Saya suka desain"

     Tapi kalau dibuka, keduanya malah menyatu jadi satu paragraf.

     Cari tahu tag mana yang lupa ditutup, lalu perbaiki.
-->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Bug 2 - Paragraf Tidak Ditutup</title>
</head>
<body>

    <h1>Tentang Saya</h1>
    <p>Nama saya Arin
    <p>Saya suka desain</p>

</body>
</html>

<!-- ---- Petunjuk ----
     Hitung jumlah tag pembuka <p> dan tag penutup </p>.
     Apakah jumlahnya sama?
     Paragraf yang tidak ditutup akan "menelan" semua konten
     setelahnya sampai ketemu tag penutup berikutnya. -->
