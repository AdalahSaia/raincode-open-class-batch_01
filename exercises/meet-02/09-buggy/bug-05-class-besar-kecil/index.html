<!-- Bug: Nama Class Beda Huruf Besar/Kecil -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Bug 5 - Class Besar Kecil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============================================================
         MISI KAMU
         ============================================================
         Kartu di bawah ini seharusnya berlatar putih dengan sudut
         membulat, seperti kartu profil di 04-css-profile.

         Tapi kalau dibuka, kartunya tidak berwarna putih sama sekali
         (masih transparan / mengikuti latar belakang halaman).

         Masalahnya ada di HTML atau CSS — buka keduanya, cari tahu
         apa yang salah, lalu perbaiki.
    -->
    <div class="Card">
        <p>Kenapa aku tidak berwarna putih?</p>
    </div>

</body>
</html>

<!-- ---- Petunjuk ----
     CSS itu case-sensitive — huruf besar dan kecil dianggap BEDA.
     Bandingkan nama class di HTML dengan selector di style.css,
     huruf demi huruf. -->
