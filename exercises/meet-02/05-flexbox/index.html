<!-- Topik: Flexbox — Kunci Tata Letak -->
<!-- HTML di file ini SUDAH LENGKAP — tugasmu ada di style.css. -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Latihan Flexbox</h1>
    <p>Secara default, elemen menumpuk ke bawah. Flexbox membuat elemen bisa berjejer dan diatur rapi.</p>

    <!-- ============================================================
         BAGIAN 1 — Menu navigasi
         ============================================================
         Sebelum diberi flex, tiga link ini akan menumpuk ke bawah
         satu-satu seperti daftar biasa.
    -->
    <h2>Bagian 1 — Menu Navigasi</h2>
    <nav class="menu">
        <a href="#">Beranda</a>
        <a href="#">Tentang</a>
        <a href="#">Kontak</a>
    </nav>

    <!-- ============================================================
         BAGIAN 2 — Chip hobi (dari project profil)
         ============================================================
         Sama seperti kartu hobi di profilmu — sebelum diberi flex,
         tiap hobi akan tampil di barisnya sendiri.
    -->
    <h2>Bagian 2 — Chip Hobi</h2>
    <div class="chip-container">
        <span class="chip">Desain</span>
        <span class="chip">Fotografi</span>
        <span class="chip">Ngopi</span>
    </div>

    <!-- ============================================================
         BAGIAN 3 — Kartu berjejer
         ============================================================
         Tiga kotak identik. Kamu akan mengatur arah susunannya.
    -->
    <h2>Bagian 3 — Kartu Berjejer</h2>
    <div class="kartu-container">
        <div class="kartu-kecil">A</div>
        <div class="kartu-kecil">B</div>
        <div class="kartu-kecil">C</div>
    </div>

</body>
</html>
