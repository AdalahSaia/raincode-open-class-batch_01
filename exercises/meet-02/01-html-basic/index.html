<!-- ============================================================
     BAGIAN 1 — Kerangka dokumen
     ============================================================
     Setiap halaman HTML punya kerangka yang SELALU sama:
       <!DOCTYPE html>  -> memberi tahu browser ini dokumen HTML
       <html>           -> pembungkus SELURUH halaman
         <head>         -> info di balik layar, tidak terlihat pengunjung
         <body>         -> semua yang terlihat pengunjung

     Kerangkanya sudah dibuatkan di bawah. Tugasmu di Bagian 2 & 3
     adalah mengisi <head> dan <body>.
-->
